apiVersion: apps/v1
kind: Deployment
metadata:   
  name: go-production-stack

spec: 
  replicas: 2
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: go-production-stack
    
  template:
    metadata:
      labels: 
        app: go-production-stack

    spec:
      containers:
        - name: go-production-stack
          image: go-production-stack:v1
          imagePullPolicy: IfNotPresent
          ports: 
            - containerPort: 8080 

          envFrom:
            - configMapRef:
                name: go-production-stack
          env: 
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD
          
          # Check whether the application has started
          startupProbe: 
            httpGet: 
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          # Check whether the application process is alive
          livenessProbe: 
            httpGet:
              path: /live
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          
          # Check whether the application can serve traffic
          readinessProbe:
            httpGet: 
              path: /ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1


        
